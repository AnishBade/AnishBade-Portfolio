<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Anish Bade</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #f7f5f0; --ink: #17161a; --ink-2: #47464d; --accent: #2a5bd7; color-scheme: light dark; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0f0f12; --ink: #f1eee8; --ink-2: #bcb9b2; --accent: #7ea6ff; } }
    body { margin: 0; min-height: 100vh; display: grid; place-content: center; gap: 18px; padding: 24px; background: var(--bg); color: var(--ink); font: 16px/1.6 Inter, system-ui, sans-serif; }
    p { margin: 0; }
    .kicker { font-size: 12.5px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
    h1 { margin: 0; font-size: clamp(44px, 8vw, 84px); line-height: 1; font-weight: 700; letter-spacing: -.04em; }
    .muted { color: var(--ink-2); }
    a { display: inline-block; padding: 12px 20px; border-radius: 999px; background: var(--ink); color: var(--bg); text-decoration: none; font-weight: 500; }
  </style>
</head>
<body>
  <p class="kicker">404 Not Found</p>
  <h1>Nothing lives here.</h1>
  <p class="muted">The page you were looking for doesn't exist. · Diese Seite existiert nicht.</p>
  <p><a href="/">← anishbade.com</a></p>
</body>
</html>
